[project]
name = "market-data-ingestion-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[pytest]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
dev-dependencies = []

[project.scripts]
mdi-demo = "market_data.demo:main"
